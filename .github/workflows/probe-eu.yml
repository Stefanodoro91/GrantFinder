name: probe-eu
on:
  push:
    branches: [probe-eu]
    paths: [probe/**, .github/workflows/probe-eu.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python probe/probe.py ${{ matrix.part }}
      - run: |
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git add probe-out && git commit -m "risultati probe ${{ matrix.part }}"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 10; done
