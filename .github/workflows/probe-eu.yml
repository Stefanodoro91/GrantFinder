name: probe-eu
on:
  push:
    branches: [probe-eu]
    paths: [probe/**, .github/workflows/probe-eu.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python probe/probe.py
      - run: |
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git add probe-out && git commit -m "risultati probe" && git pull --rebase && git push
