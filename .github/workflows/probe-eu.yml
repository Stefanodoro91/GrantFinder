name: probe-eu
on:
  push:
    branches: [probe-eu]
    paths: [probe/**, .github/workflows/probe-eu.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt playwright && python -m playwright install --with-deps chromium
      - run: python probe/feeds.py
      - run: |
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git add probe-out && git commit -m "risultati probe browser"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 10; done
