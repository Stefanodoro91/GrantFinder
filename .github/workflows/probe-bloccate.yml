name: Prova fonti bloccate
on:
  push:
    branches: [fonti-bloccate]
    paths: [tools/probe_bloccate.py, .github/workflows/probe-bloccate.yml]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt playwright && python -m playwright install --with-deps chromium
      - run: python tools/probe_bloccate.py
